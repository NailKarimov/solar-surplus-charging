name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '50 3 * * *' # nightly, 03:50 UTC
  workflow_dispatch:
    inputs:
      mutants:
        description: 'Also run the mutation check (about 6 minutes)'
        type: boolean
        default: false

permissions:
  contents: write # publish the reports and the visual page to gh-pages

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v5 # Allure CLI needs Java
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          pip install -e ".[dev,pages]"
          python -m playwright install --with-deps chromium

      - name: Lint and type check
        run: |
          ruff check .
          ruff format --check .
          mypy src tests scripts

      - name: Straight into the model
        id: direct
        continue-on-error: true
        env:
          DRIVER: direct
        run: pytest -m "not pages" --alluredir=allure-results

      - name: Through a Modbus TCP wallbox
        id: modbus
        continue-on-error: true
        env:
          DRIVER: modbus
        run: pytest -m "not pages" --alluredir=allure-results

      - name: Through an OCPP charge point
        id: ocpp
        continue-on-error: true
        env:
          DRIVER: ocpp
        run: pytest -m "not pages" --alluredir=allure-results

      - name: Build the visual page from this run
        id: build
        run: python scripts/build_pages.py --check

      - name: The JavaScript twin decides like the Python controller
        id: twin
        continue-on-error: true
        run: node site/test/twin.test.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The visual page in a browser
        id: pages
        continue-on-error: true
        env:
          EVIDENCE: '0'
        run: pytest -m pages --alluredir=allure-results

      - name: Allure report with history
        if: always()
        run: |
          git fetch origin gh-pages --depth=1 && git worktree add gh-pages-old origin/gh-pages \
            && cp -r gh-pages-old/history allure-results/ 2>/dev/null || true
          npx --yes allure-commandline@2 generate allure-results --clean -o site-out
          cp docs/surplus-charging.html site-out/
          mkdir -p site-out/mutants && cp mutants-result.md site-out/mutants/result.md

      - name: Publish to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site-out
          keep_files: true

      - name: Fail the job if anything failed
        if: >-
          steps.direct.outcome == 'failure' || steps.modbus.outcome == 'failure' || steps.ocpp.outcome == 'failure'
          || steps.twin.outcome == 'failure' || steps.pages.outcome == 'failure'
        run: exit 1

  mutants:
    # On demand: 37 planted bugs, the suite once per bug.
    if: inputs.mutants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Mutation check
        run: |
          python scripts/mutants.py
          cat mutants-result.md >> "$GITHUB_STEP_SUMMARY"
